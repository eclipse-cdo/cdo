       id="arrow"
       viewBox="0 0 10 10"
       refX="8.5"
       refY="5"
       markerWidth="7"
       markerHeight="7"
       orient="auto">
      <path
         d="M0 0L10 5L0 10Z"
         fill="#526477"
         id="path1" />
    </marker>
    <style
       id="style1">
      text { font-family: Arial, Helvetica, sans-serif; fill: #203247; }
      .start, .action { fill: #edf3f8; stroke: #53728e; stroke-width: 2; }
      .decision { fill: #fff4d6; stroke: #a97812; stroke-width: 2; }
      .terminal { fill: #e8f3eb; stroke: #39804d; stroke-width: 2; }
      .failure { fill: #fae9e7; stroke: #a83e36; stroke-width: 2; }
      .line { fill: none; stroke: #526477; stroke-width: 2; marker-end: url(#arrow); }
      .plain-line { fill: none; stroke: #526477; stroke-width: 2; }
      .main { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 15px; text-anchor: middle; }
      .sub-start { font-size: 15px; text-anchor: start; }
      .branch { font-size: 15px; font-weight: 700; }
      .end { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-anchor: middle; fill: #39734a; }
      .marker { fill: #ffffff; stroke: #53728e; stroke-width: 2; }
      .marker-text { font-size: 14px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
