  <title
     id="title">Binding Strategy Resolution</title>
  <desc
     id="description">CompiledStatement checks explicit setters, explicit converters, configured setters, and configured converters in that order. Explicit converters bypass configured strategies. The resulting value then follows explicit JDBC typing, untyped NULL validation, or adapter binding.</desc>
