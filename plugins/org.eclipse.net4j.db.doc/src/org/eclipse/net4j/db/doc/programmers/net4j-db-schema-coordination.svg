<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">Managed statement and schema-change coordination</title>
  <desc id="desc">A managed prepare takes a schema read token held through statement checkout until close. Schema transaction completion first runs adapter DDL, then requests exclusive schema access, waits for active managed statements, invalidates each managed connection cache, emits a schema-change event, and releases the writer. Later prepares use cleared caches.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4f6578"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#a34a45"/></marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #243747; }
      .title { font-size: 24px; font-weight: 700; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .note { font-size: 12px; fill: #4b5c69; }
      .step { fill: #f3f7fa; stroke: #73889a; stroke-width: 1.7; rx: 11; }
      .read { fill: #eaf4fa; stroke: #2878a8; }
      .write { fill: #fff1ed; stroke: #ad574c; }
      .event { fill: #edf7ef; stroke: #438359; }
      .line { stroke: #4f6578; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .red { stroke: #a34a45; stroke-width: 2; fill: none; marker-end: url(#redArrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1120" height="690" fill="#ffffff"/>
  <text x="34" y="42" class="title">Managed statement lifetime and schema completion</text>
  <text x="34" y="69" class="note">The queue coordinates managed checkouts and cache invalidation; physical DDL occurs before the exclusive invalidation phase.</text>

  <rect x="44" y="112" width="315" height="108" class="step read"/>
  <text x="201" y="143" text-anchor="middle" class="head">1 · Managed preparation</text>
  <text x="201" y="169" text-anchor="middle" class="body">DBConnection requests READ access</text>
  <text x="201" y="193" text-anchor="middle" class="body">and checks out or creates a statement</text>

  <rect x="402" y="112" width="315" height="108" class="step read"/>
  <text x="559" y="143" text-anchor="middle" class="head">2 · Statement checked out</text>
  <text x="559" y="169" text-anchor="middle" class="body">Token remains held while binding,</text>
  <text x="559" y="193" text-anchor="middle" class="body">executing, and consuming results</text>

  <rect x="760" y="112" width="315" height="108" class="step read"/>
  <text x="917" y="143" text-anchor="middle" class="head">3 · Statement closed</text>
  <text x="917" y="169" text-anchor="middle" class="body">Returned to its connection cache;</text>
  <text x="917" y="193" text-anchor="middle" class="body">READ token is released</text>

  <path d="M359 166 L402 166" class="line"/>
  <path d="M717 166 L760 166" class="line"/>

  <rect x="44" y="283" width="315" height="116" class="step write"/>
  <text x="201" y="313" text-anchor="middle" class="head">Physical schema update</text>
  <text x="201" y="339" text-anchor="middle" class="body">Schema transaction calls adapter</text>
  <text x="201" y="363" text-anchor="middle" class="body">updateSchema(connection, schema, delta)</text>
  <text x="201" y="384" text-anchor="middle" class="note">This step is outside the queue's writer access.</text>

  <rect x="402" y="283" width="315" height="116" class="step write"/>
  <text x="559" y="313" text-anchor="middle" class="head">Request exclusive WRITE access</text>
  <text x="559" y="339" text-anchor="middle" class="body">Writer queues behind active readers</text>
  <text x="559" y="363" text-anchor="middle" class="body">and waits for their tokens to end</text>
  <text x="559" y="384" text-anchor="middle" class="note">A forgotten checked-out statement can delay it.</text>

  <rect x="760" y="283" width="315" height="116" class="step write"/>
  <text x="917" y="313" text-anchor="middle" class="head">Invalidate managed caches</text>
  <text x="917" y="339" text-anchor="middle" class="body">Close cached JDBC statements and clear</text>
  <text x="917" y="363" text-anchor="middle" class="body">each currently managed connection cache</text>
  <text x="917" y="384" text-anchor="middle" class="note">There is no database-wide statement cache.</text>

  <path d="M359 341 L402 341" class="red"/>
  <path d="M717 341 L760 341" class="red"/>

  <rect x="222" y="464" width="315" height="105" class="step event"/>
  <text x="379" y="494" text-anchor="middle" class="head">Notify schema change</text>
  <text x="379" y="520" text-anchor="middle" class="body">Emit event carrying the schema delta</text>
  <text x="379" y="544" text-anchor="middle" class="body">then release exclusive queue access</text>

  <rect x="584" y="464" width="362" height="105" class="step read"/>
  <text x="765" y="494" text-anchor="middle" class="head">Later managed preparation</text>
  <text x="765" y="520" text-anchor="middle" class="body">Obtains READ access after the writer;</text>
  <text x="765" y="544" text-anchor="middle" class="body">cache lookup cannot return invalidated SQL</text>

  <path d="M917 399 L917 438 L379 438 L379 464" class="line"/>
  <path d="M537 517 L584 517" class="line"/>

  <rect x="44" y="606" width="1031" height="52" class="step"/>
  <text x="559" y="628" text-anchor="middle" class="body">Commit ordering: adapter update and schema completion/invalidation occur before the connection-backed commit() call.</text>
  <text x="559" y="648" text-anchor="middle" class="note">This is not a claim of portable DDL atomicity, server isolation, or coordination for unmanaged JDBC statements.</text>
</svg>
