  <title
     id="title">Default JDBC Parameter Binding</title>
  <desc
     id="description">DBAdapter.bindParameter first handles NULL values, then known DBTypes, then the configurable Java-type fallback. Every decision sends YES to the right and NO downward. Binding uses typed JDBC hooks when applicable and bindParameterObject otherwise. The Java-type fallback defaults to false.</desc>
