  <title
     id="title">Net4j DB public architecture</title>
  <desc
     id="desc">Adapters and connection providers configure a database that owns a managed schema and creates managed connections. Schema transactions work on schema copies. SQL templates compile with adapters into statements, then prepare on a connection as caller-managed prepared statements.</desc>
