  <title
     id="title">Managed statement and schema-change coordination</title>
  <desc
     id="desc">A managed prepare takes a schema read token held through statement checkout until close. Schema transaction completion first runs adapter DDL, then requests exclusive schema access, waits for active managed statements, invalidates each managed connection cache, emits a schema-change event, and releases the writer. Later prepares use cleared caches.</desc>
  <defs
     id="defs2">
    <marker
       id="arrow"
       markerWidth="10"
       markerHeight="8"
       refX="9"
       refY="4"
       orient="auto">
      <path
         d="M 0,0 10,4 0,8 Z"
         fill="#4f6578"
         id="path1" />
    </marker>
    <marker
       id="redArrow"
       markerWidth="10"
       markerHeight="8"
       refX="9"
       refY="4"
       orient="auto">
      <path
         d="M 0,0 10,4 0,8 Z"
         fill="#a34a45"
         id="path2" />
    </marker>
    <style
       id="style2">
      text { font-family: &quot;Segoe UI&quot;, Arial, sans-serif; fill: #243747; }
      .title { font-size: 24px; font-weight: 700; }
      .head { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .note { font-size: 12px; fill: #4b5c69; }
      .step { fill: #f3f7fa; stroke: #73889a; stroke-width: 1.7; rx: 11; }
      .read { fill: #eaf4fa; stroke: #2878a8; }
      .write { fill: #fff1ed; stroke: #ad574c; }
      .event { fill: #edf7ef; stroke: #438359; }
      .line { stroke: #4f6578; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .red { stroke: #a34a45; stroke-width: 2; fill: none; marker-end: url(#redArrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <g
     id="g32"
     transform="matrix(0.8,0,0,0.8,-34.52,-88.92)">
    <rect
       x="44"
       y="112"
       width="315"
       height="108"
       class="step read"
       id="rect3" />
    <text
       x="201"
       y="143"
       text-anchor="middle"
       class="head"
       id="text4">1 · Managed preparation</text>
    <text
       x="201"
       y="169"
       text-anchor="middle"
       class="body"
       id="text5">DBConnection requests READ access</text>
    <text
       x="201"
       y="193"
       text-anchor="middle"
       class="body"
       id="text6">and checks out or creates a statement</text>
    <rect
       x="402"
       y="112"
       width="315"
       height="108"
       class="step read"
       id="rect6" />
    <text
       x="559"
       y="143"
       text-anchor="middle"
       class="head"
       id="text7">2 · Statement checked out</text>
    <text
       x="559"
       y="169"
       text-anchor="middle"
       class="body"
       id="text8">Token remains held while binding,</text>
    <text
       x="559"
       y="193"
       text-anchor="middle"
       class="body"
       id="text9">executing, and consuming results</text>
    <rect
       x="760"
       y="112"
       width="315"
       height="108"
       class="step read"
       id="rect9" />
    <text
       x="917"
       y="143"
       text-anchor="middle"
       class="head"
       id="text10">3 · Statement closed</text>
    <text
       x="917"
       y="169"
       text-anchor="middle"
       class="body"
       id="text11">Returned to its connection cache;</text>
    <text
       x="917"
       y="193"
       text-anchor="middle"
       class="body"
       id="text12">READ token is released</text>
    <path
       d="m 359,166 h 43"
       class="line"
       id="path12" />
    <path
       d="m 717,166 h 43"
       class="line"
       id="path13" />
    <rect
       x="44"
       y="283"
       width="315"
       height="116"
       class="step write"
       id="rect13" />
    <text
       x="201"
       y="313"
       text-anchor="middle"
       class="head"
       id="text13">Physical schema update</text>
    <text
       x="201"
       y="339"
       text-anchor="middle"
       class="body"
       id="text14">Schema transaction calls adapter</text>
    <text
       x="201"
       y="363"
       text-anchor="middle"
       class="body"
       id="text15">updateSchema(connection, schema, delta)</text>
    <text
       x="201"
       y="384"
       text-anchor="middle"
       class="note"
       id="text16">This step is outside the queue's writer access.</text>
    <rect
       x="402"
       y="283"
       width="315"
       height="116"
       class="step write"
       id="rect16" />
    <text
       x="559"
       y="313"
       text-anchor="middle"
       class="head"
       id="text17">Request exclusive WRITE access</text>
    <text
       x="559"
       y="339"
       text-anchor="middle"
       class="body"
       id="text18">Writer queues behind active readers</text>
    <text
       x="559"
       y="363"
       text-anchor="middle"
       class="body"
       id="text19">and waits for their tokens to end</text>
    <text
       x="559"
       y="384"
       text-anchor="middle"
       class="note"
       id="text20">A forgotten checked-out statement can delay it.</text>
    <rect
       x="760"
       y="283"
       width="315"
       height="116"
       class="step write"
       id="rect20" />
    <text
       x="917"
       y="313"
       text-anchor="middle"
       class="head"
       id="text21">Invalidate managed caches</text>
    <text
       x="917"
       y="339"
       text-anchor="middle"
       class="body"
       id="text22">Close cached JDBC statements and clear</text>
    <text
       x="917"
       y="363"
       text-anchor="middle"
       class="body"
       id="text23">each currently managed connection cache</text>
    <text
       x="917"
       y="384"
       text-anchor="middle"
       class="note"
       id="text24">There is no database-wide statement cache.</text>
    <path
       d="m 359,341 h 43"
       class="red"
       id="path24" />
    <path
       d="m 717,341 h 43"
       class="red"
       id="path25" />
    <rect
       x="222"
       y="464"
       width="315"
       height="105"
       class="step event"
       id="rect25" />
    <text
       x="379"
       y="494"
       text-anchor="middle"
       class="head"
       id="text25">Notify schema change</text>
    <text
       x="379"
       y="520"
       text-anchor="middle"
       class="body"
       id="text26">Emit event carrying the schema delta</text>
    <text
       x="379"
       y="544"
       text-anchor="middle"
       class="body"
       id="text27">then release exclusive queue access</text>
    <rect
       x="584"
       y="464"
       width="362"
       height="105"
       class="step read"
       id="rect27" />
    <text
       x="765"
       y="494"
       text-anchor="middle"
       class="head"
       id="text28">Later managed preparation</text>
    <text
       x="765"
       y="520"
       text-anchor="middle"
       class="body"
       id="text29">Obtains READ access after the writer;</text>
    <text
       x="765"
       y="544"
       text-anchor="middle"
       class="body"
       id="text30">cache lookup cannot return invalidated SQL</text>
    <path
       d="m 917,399 v 39 H 379 v 26"
       class="line"
       id="path30" />
    <path
       d="m 537,517 h 47"
       class="line"
       id="path31" />
  </g>
